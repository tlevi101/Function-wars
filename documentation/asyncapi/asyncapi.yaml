asyncapi: 3.0.0
info:
  title: Function Wars Realtime API
  version: '1.0.0'
  description: |
    Socket.IO event contract for the Function Wars backend, describing the realtime layer that
    sits alongside the REST API in `documentation/openapi`. Every message here travels over a
    single Socket.IO connection on the default namespace (`/`) — there is one physical WebSocket
    per client, and every event below is multiplexed over it by Socket.IO's own framing, not by
    separate URLs or namespaces.

    This document describes the **server application**. `action: receive` means the server
    receives that message (the client sends it); `action: send` means the server sends it (the
    client receives it).

    ### Connecting
    The client opens the Socket.IO connection with the same JWT used for the REST API, passed as
    a `token` query parameter on the handshake (not an `Authorization` header — Socket.IO's
    handshake happens before any per-message headers exist). The server verifies it with the
    same secret/algorithm as the HTTP `bearerAuth` scheme and rejects the connection outright
    (`Authentication error`) if it's missing or invalid; there is no unauthenticated access,
    including for guests, who still need a guest JWT from `POST /register-guest` first.

    ### Presence & lifecycle (not modeled as messages below)
    - `route change` (below) is how the server tracks which screen a client is on; it drives
      automatic game/wait-room cleanup and rejoin, not just analytics.
    - Socket.IO's built-in `disconnect` triggers the same wait-list/wait-room/game cleanup as
      navigating away, but on a 10 second grace timer (`SocketConnectionService.TIME_TO_RECONNECT`)
      to tolerate brief network drops — a client reconnecting and re-sending `route change` with
      a `/games/{uuid}` URL within that window resumes the game instead of forfeiting it.
    - Reconnecting into a game additionally re-joins the game's group chat automatically.
  contact:
    name: Function Wars
defaultContentType: application/json
servers:
  production:
    host: functionwars-api.tensura101.com
    protocol: wss
    description: Production Socket.IO endpoint (self-hosted, behind Cloudflare).
    security:
      - $ref: '#/components/securitySchemes/handshakeToken'
  development:
    host: localhost:3000
    protocol: ws
    description: Local development.
    security:
      - $ref: '#/components/securitySchemes/handshakeToken'

