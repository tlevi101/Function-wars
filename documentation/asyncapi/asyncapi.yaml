components:
  securitySchemes:
    handshakeToken:
      type: httpApiKey
      name: token
      in: query
      description: >-
        The same JWT issued by the REST API's `/register-guest`, `/register`, or `/login`
        (see `documentation/openapi`), passed as a query parameter on the Socket.IO handshake
        request rather than as a header.

  # Central registry of every payload schema, for tools that resolve components.schemas by name.
  # Shared domain types are the same physical files the OpenAPI spec uses (documentation/openapi
  # /components/schemas) — there is deliberately one definition of e.g. GamePlayer or
  # SessionUser for both documents to reference, not a duplicate.
  schemas:
    RouteChangePayload:
      $ref: './components/schemas/misc-events.yaml#/RouteChangePayload'
    ErrorPayload:
      $ref: './components/schemas/misc-events.yaml#/ErrorPayload'
    CreateCustomGamePayload:
      $ref: './components/schemas/custom-game-events.yaml#/CreateCustomGamePayload'
    RoomUUIDPayload:
      $ref: './components/schemas/custom-game-events.yaml#/RoomUUIDPayload'
    WaitingRoomCreatedPayload:
      $ref: './components/schemas/custom-game-events.yaml#/WaitingRoomCreatedPayload'
    InviteRef:
      $ref: './components/schemas/invite-events.yaml#/InviteRef'
    RejectInvitePayload:
      $ref: './components/schemas/invite-events.yaml#/RejectInvitePayload'
    ReceiveInvitePayload:
      $ref: './components/schemas/invite-events.yaml#/ReceiveInvitePayload'
    SendChatMessagePayload:
      $ref: './components/schemas/chat-events.yaml#/SendChatMessagePayload'
    SetSeenPayload:
      $ref: './components/schemas/chat-events.yaml#/SetSeenPayload'
    SendGroupChatMessagePayload:
      $ref: './components/schemas/chat-events.yaml#/SendGroupChatMessagePayload'
    FunctionPoints:
      $ref: './components/schemas/game-events.yaml#/FunctionPoints'
    FunctionDamages:
      $ref: './components/schemas/game-events.yaml#/FunctionDamages'
    JoinedGamePayload:
      $ref: './components/schemas/game-events.yaml#/JoinedGamePayload'
    ReceiveFunctionPayload:
      $ref: './components/schemas/game-events.yaml#/ReceiveFunctionPayload'
    GameOverPayload:
      $ref: './components/schemas/game-events.yaml#/GameOverPayload'

    # Shared with documentation/openapi — see note above.
    Point:
      $ref: '../openapi/components/schemas/geometry.yaml#/Point'
    DamageCircle:
      $ref: '../openapi/components/schemas/geometry.yaml#/DamageCircle'
    SessionUser:
      $ref: './components/schemas/session-user.yaml#/SessionUser'
    GamePlayer:
      $ref: '../openapi/components/schemas/game.yaml#/GamePlayer'
    GameField:
      $ref: '../openapi/components/schemas/game.yaml#/GameField'
    ChatMessage:
      $ref: '../openapi/components/schemas/chat.yaml#/ChatMessage'
    GroupChatMessage:
      $ref: '../openapi/components/schemas/group-chat.yaml#/GroupChatMessage'
    MessageResponse:
      $ref: '../openapi/components/schemas/common.yaml#/MessageResponse'
