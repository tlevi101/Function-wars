ChatMessage:
  type: object
  description: A single message in a 1:1 friend chat.
  required:
    - from
    - message
    - seen
  properties:
    from:
      type: integer
      format: int32
      description: Id of the sending user.
    message:
      type: string
    seen:
      type: boolean
      description: Whether the recipient has opened the chat since this message was sent.
  additionalProperties: false

Chat:
  type: object
  description: The full message history between the current user and one friend.
  required:
    - id
    - friendship_id
    - messages
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int32
    friendship_id:
      type: integer
      format: int32
    messages:
      type: array
      items:
        $ref: './chat.yaml#/ChatMessage'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  additionalProperties: false
