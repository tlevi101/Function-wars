ReportedUser:
  type: object
  description: Snapshot of the reported user's moderation-relevant state, as shown to admins.
  required:
    - id
    - name
    - email
    - chat_restriction
    - banned
    - banned_reason
  properties:
    id:
      type: integer
      format: int32
    name:
      type: string
    email:
      type: string
      format: email
    chat_restriction:
      type: boolean
    banned:
      type: boolean
    banned_reason:
      type: string
      nullable: true
  additionalProperties: false

Report:
  type: object
  description: A user-submitted report against another user, as listed for admins.
  required:
    - id
    - description
    - handled
    - deletedAt
    - createdAt
    - updatedAt
    - reportedBy
    - reportedUser
  properties:
    id:
      type: integer
      format: int32
    description:
      type: string
      description: Free-text reason supplied by the reporting user.
    handled:
      type: boolean
      description: True once an admin has acted on this report (e.g. banned or dismissed).
    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: >-
        Soft-delete timestamp. Deleting an already-handled report a second time permanently
        removes it.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    reportedBy:
      $ref: './user.yaml#/UserContact'
    reportedUser:
      $ref: './report.yaml#/ReportedUser'
  additionalProperties: false

CreateReportRequest:
  type: object
  required:
    - description
  properties:
    description:
      type: string
      description: Reason for reporting the user.
  additionalProperties: false

BanUserRequest:
  type: object
  properties:
    banned_reason:
      type: string
      nullable: true
      maxLength: 255
      description: Reason shown to the banned user and stored on their account.
  additionalProperties: false
