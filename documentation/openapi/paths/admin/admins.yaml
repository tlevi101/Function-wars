get:
  tags:
    - Admin
  summary: List admins
  operationId: listAdmins
  responses:
    '200':
      description: "Every user with `is_admin: true`."
      content:
        application/json:
          schema:
            type: object
            required:
              - admins
            properties:
              admins:
                type: array
                items:
                  $ref: '../../components/schemas/user.yaml#/User'
            additionalProperties: false
    '401':
      $ref: '../../components/responses/common.yaml#/Unauthorized'
    '403':
      $ref: '../../components/responses/common.yaml#/AdminForbidden'
