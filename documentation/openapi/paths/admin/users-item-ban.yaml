parameters:
  - $ref: '../../components/parameters/common.yaml#/UserId'

put:
  tags:
    - Admin
  summary: Ban a user
  description: >-
    Marks every open report against this user as handled. If the user is currently online, ends
    their active game (if any) and pushes a `banned` Socket.IO event to them.
  operationId: banUser
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/report.yaml#/BanUserRequest'
  responses:
    '200':
      description: User banned.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/MessageResponse'
          example:
            message: User banned.
    '401':
      $ref: '../../components/responses/common.yaml#/Unauthorized'
    '403':
      $ref: '../../components/responses/common.yaml#/AdminForbidden'
    '404':
      $ref: '../../components/responses/common.yaml#/NotFound'
