parameters:
  - $ref: '../../components/parameters/common.yaml#/UserIdCamel'

put:
  tags:
    - Admin
  summary: Grant admin role
  description: "Sets `is_admin: true` and `role: \"admin\"`. Cannot be used on a `super_admin`."
  operationId: makeAdmin
  responses:
    '200':
      description: User is now an admin.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/MessageResponse'
          example:
            message: User is now admin.
    '401':
      $ref: '../../components/responses/common.yaml#/Unauthorized'
    '403':
      description: Caller is a guest or not an admin, or the target user is a super admin.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/ErrorResponse'
    '404':
      $ref: '../../components/responses/common.yaml#/NotFound'
