post:
  tags:
    - Auth
  summary: Request a password reset email
  operationId: forgotPassword
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth.yaml#/ForgotPasswordRequest'
  responses:
    '201':
      description: >-
        Reset email sent (or, in test environments, the reset uuid returned directly instead of
        emailing it).
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth.yaml#/ForgotPasswordResponse'
    '400':
      description: Email missing.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/ErrorResponse'
    '403':
      description: The account is banned.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth.yaml#/BannedResponse'
    '404':
      description: No account with that email.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/ErrorResponse'
