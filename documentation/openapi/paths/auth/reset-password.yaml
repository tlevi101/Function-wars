put:
  tags:
    - Auth
  summary: Complete a password reset
  operationId: resetPassword
  security: []
  parameters:
    - $ref: '../../components/parameters/common.yaml#/ResetUuid'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth.yaml#/ResetPasswordRequest'
  responses:
    '200':
      description: Password updated.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/MessageResponse'
          example:
            message: Password updated
    '400':
      description: >-
        Reset link expired (older than 1 hour; also deletes the link), password/passwordAgain
        missing, or passwords do not match.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/ErrorResponse'
    '404':
      description: Unknown or already-used reset link.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/ErrorResponse'
