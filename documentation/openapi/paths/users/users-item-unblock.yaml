parameters:
  - $ref: '../../components/parameters/common.yaml#/UserId'

delete:
  tags:
    - Users
  summary: Unblock a user
  operationId: unblockUser
  responses:
    '200':
      description: User unblocked.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/MessageResponse'
          example:
            message: User unblocked.
    '401':
      $ref: '../../components/responses/common.yaml#/Unauthorized'
    '403':
      $ref: '../../components/responses/common.yaml#/GuestForbidden'
    '404':
      description: Caller not found, target user not found, or the target user is not currently blocked.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yaml#/ErrorResponse'
